# After every push to main, add anyone new who has changed Dads Army to dadsarmy/CREDITS.md.
# The app shows that file under Help -> Credits. See tools/update_credits.py for the rules.
name: Credit new contributors

on:
  push:
    branches: [main]
  workflow_dispatch:   # "Run workflow" on the Actions tab, to run it by hand

permissions:
  contents: write      # to commit the credits file

concurrency:
  group: credits
  cancel-in-progress: false

jobs:
  credits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, so everyone is found

      - name: Add anyone new to CREDITS.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_credits.py

      - name: Commit the change, if there is one
        run: |
          if git diff --quiet -- dadsarmy/CREDITS.md; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dadsarmy/CREDITS.md
          git commit -m "Credit new contributors"
          git pull --rebase origin main
          git push origin HEAD:main
